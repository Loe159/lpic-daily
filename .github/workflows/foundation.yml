name: Foundation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curriculum, learning graph and schemas
        run: python3 scripts/validate_foundation.py

  go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate real curriculum through Go loader
        run: go run ./cmd/lpic validate
      - name: Smoke-test initial scheduler
        run: go run ./cmd/lpic plan
