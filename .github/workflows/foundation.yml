name: Foundation and core validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curriculum, learning graph and schemas
        run: python3 scripts/validate_foundation.py

  go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module files are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        shell: bash
        run: |
          dirty="$(find . -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [ -n "$dirty" ]; then
            echo "These files need gofmt:"
            echo "$dirty"
            echo
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "::group::gofmt diff: $file"
              gofmt -d "$file"
              echo "::endgroup::"
            done <<< "$dirty"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Compile Podman integration tests
        run: go test -tags=integration ./internal/runner/podman -run 'a^'
      - name: Vet
        run: go vet ./...
      - name: Validate embedded curriculum through Go loader
        run: go run ./cmd/lpic validate

  fedora-core:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Fedora runner prerequisites
        run: dnf -y install git-core python3 tar gzip findutils
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate foundation on Fedora
        run: python3 scripts/validate_foundation.py
      - name: Test Go core on Fedora
        run: go test ./...
      - name: Validate embedded content on Fedora
        run: go run ./cmd/lpic validate

  podman-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install rootless Podman prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
      - name: Build Phase-1 lab image
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/lpic-daily-runtime"
          mkdir -p "$XDG_RUNTIME_DIR" "$HOME/.config/containers"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat > "$HOME/.config/containers/containers.conf" <<'EOF'
          [engine]
          cgroup_manager="cgroupfs"
          events_logger="file"
          EOF
          podman info
          podman build -t localhost/lpic-daily/fedora-phase1:1 -f labs/images/fedora-phase1/Containerfile labs/images/fedora-phase1
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Start rootless Podman API
        shell: bash
        run: |
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock" >"$RUNNER_TEMP/podman-service.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/podman-service.log"
          exit 1
      - name: Run real Podman security and Phase-1 lab conformance tests
        env:
          LPIC_DAILY_RUN_PODMAN_INTEGRATION: "1"
        run: go test -tags=integration ./internal/runner/podman -count=1 -v

  podman-security-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    steps:
      - name: Install Fedora rootless Podman prerequisites
        run: |
          dnf -y install git-core python3 tar gzip findutils podman shadow-utils
          useradd --create-home --uid 1000 lpicci
          # Nested GitHub job containers cannot delegate subordinate IDs.
          # Podman supports a single-UID rootless mode for this kind of CI/HPC
          # environment when VFS ignores image chown operations.
          sed -i '/^lpicci:/d' /etc/subuid /etc/subgid
          install -d -o lpicci -g lpicci -m 0700 /run/user/1000
          install -d -o lpicci -g lpicci /home/lpicci/.config/containers
          cat > /home/lpicci/.config/containers/containers.conf <<'EOF'
          [engine]
          cgroup_manager="cgroupfs"
          events_logger="file"
          EOF
          cat > /home/lpicci/.config/containers/storage.conf <<'EOF'
          [storage]
          driver="vfs"
          runroot="/run/user/1000/containers"
          graphroot="/home/lpicci/.local/share/containers/storage"

          [storage.options.vfs]
          ignore_chown_errors="true"
          EOF
          chown -R lpicci:lpicci /home/lpicci/.config
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Phase-1 image with Fedora rootless Podman
        run: |
          runuser -u lpicci -- env HOME=/home/lpicci XDG_RUNTIME_DIR=/run/user/1000 podman info
          runuser -u lpicci -- env HOME=/home/lpicci XDG_RUNTIME_DIR=/run/user/1000 \
            podman build -t localhost/lpic-daily/fedora-phase1:1 \
            -f labs/images/fedora-phase1/Containerfile labs/images/fedora-phase1
      - name: Start Fedora rootless Podman API
        run: |
          runuser -u lpicci -- mkdir -p /run/user/1000/podman
          runuser -u lpicci -- env HOME=/home/lpicci XDG_RUNTIME_DIR=/run/user/1000 \
            podman system service --time=0 unix:///run/user/1000/podman/podman.sock \
            >/tmp/lpic-daily-fedora-podman.log 2>&1 &
          for attempt in $(seq 1 30); do
            if [ -S /run/user/1000/podman/podman.sock ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lpic-daily-fedora-podman.log
          exit 1
      - name: Run Fedora rootless Podman conformance tests
        env:
          XDG_RUNTIME_DIR: /run/user/1000
          LPIC_DAILY_RUN_PODMAN_INTEGRATION: "1"
        run: go test -tags=integration ./internal/runner/podman -count=1 -v
