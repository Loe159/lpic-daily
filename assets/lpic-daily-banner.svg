<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">LPIC Daily</title>
  <desc id="desc">Apprends Linux. Pratique chaque jour.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="64%">
      <stop offset="0%" stop-color="#123329"/>
      <stop offset="46%" stop-color="#0d1c1b"/>
      <stop offset="100%" stop-color="#091017"/>
    </radialGradient>
    <linearGradient id="daily" x1="0" x2="1">
      <stop offset="0%" stop-color="#55e58a"/>
      <stop offset="100%" stop-color="#75f29c"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="24" fill="url(#glow)"/>

  <g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="800" y="238" font-size="138" font-weight="750" letter-spacing="-4">
      <tspan fill="#f3f5f4">LPIC </tspan><tspan fill="url(#daily)">Daily</tspan>
    </text>

    <text x="800" y="318" fill="#cbd2d0" font-size="42" font-weight="400" letter-spacing="2">
      Apprends Linux. Pratique chaque jour.
    </text>

    <rect x="782" y="365" width="36" height="7" rx="3.5" fill="#69ed96" filter="url(#softGlow)"/>
  </g>
</svg>
